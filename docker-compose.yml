version: "3.9"

services:

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: booking_san
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SQLGandon
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Boo.sql:/docker-entrypoint-initdb.d/Boo.sql
    ports:
      - "5432:5432"

  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data: 
